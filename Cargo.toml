[package]
name = "tuipwa"
version = "0.3.0"
edition = "2024"
license = "MIT"
build = "build.rs"

[[bin]]
name = "tuipwa"
path = "src/main.rs"

[dependencies]
fontdue = "0.9"
libc = "0.2"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
cc = "1"
pkg-config = "0.3"
